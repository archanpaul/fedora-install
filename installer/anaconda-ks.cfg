# Generated by Anaconda 44.30
# Keyboard layouts
keyboard --vckeymap=us --xlayouts='us'
# System language
lang en_IN.UTF-8

%packages
@^workstation-product-environment

%end

# System authorization information
authselect enable-feature with-fingerprint

# Run the Setup Agent on first boot
firstboot --enable

# Generated using Blivet version 3.13.2
ignoredisk --only-use=nvme0n1
# Partition clearing information
clearpart --none --initlabel
# Disk partitioning information
part btrfs.202 --fstype="btrfs" --ondisk=nvme0n1 --size=975961 --encrypted --luks-version=luks2
part /boot --fstype="ext4" --ondisk=nvme0n1 --size=640 --label="boot"
part /boot/efi --fstype="efi" --ondisk=nvme0n1 --size=160 --fsoptions="umask=0077,shortname=winnt" --label="efi"
btrfs none btrfs.202
btrfs /var --subvol --name=@var
btrfs /opt --subvol --name=@opt
btrfs /home --subvol --name=@home
btrfs / --subvol --name=@root
btrfs /snapshots --subvol --name=@snapshots

# System timezone
timezone Asia/Kolkata --utc
